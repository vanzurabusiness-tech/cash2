<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add to Wallet</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #000000; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 24px;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.4s ease-out;
        }
        .icon-wrap {
            width: 80px;
            height: 80px;
            background: #1c1c1e;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .icon-wrap svg {
            width: 40px;
            height: 40px;
            color: #ffffff;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        p {
            font-size: 16px;
            color: #8e8e93;
            margin-bottom: 40px;
            line-height: 1.4;
        }
        .wallet-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            color: #000000;
            font-size: 17px;
            font-weight: 600;
            text-decoration: none;
            padding: 18px 24px;
            border-radius: 999px;
            width: 100%;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }
        .wallet-btn:active {
            transform: scale(0.96);
            opacity: 0.8;
        }
        .wallet-btn svg {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            fill: currentColor;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                <line x1="2" y1="10" x2="22" y2="10"></line>
            </svg>
        </div>

        <h1>Wallet Pass Ready</h1>
        <p>Tap below to add GravyPass to your device.</p>

        <a href="https://raintrks.com/r/eyJ0IjoiZ3JhdnlwYXNzIiwidSI6IjY5OTk4ZmY0YWQ3N2NiM2RmODkwMmNlMCIsInRzIjoxNzczNTI0MDY4MDE1fQ?s2=tst" class="wallet-btn">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
            </svg>
            Add to Wallet
        </a>
    </div>

</body>
</html>
