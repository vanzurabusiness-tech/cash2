<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Status: Eligible ($750.00)</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b1120; color: white; overflow: hidden; }
        .btn-slide-in { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        /* Fixed "Too Dark" Pulse  */
        .pulse-glow { animation: glow 2s ease-in-out infinite; }
        @keyframes glow { 0%, 100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.03); filter: brightness(1.2); box-shadow: 0 0 20px rgba(34,197,94,0.6); } }
    </style>
</head>
<body class="antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [verifying, setVerifying] = useState(true);
            const [timeLeft, setTimeLeft] = useState(300); // 5 minutes in seconds 

            useEffect(() => {
                // Verification delay [cite: 1]
                const verifyTimer = setTimeout(() => setVerifying(false), 3000);
                
                // Working Countdown Timer 
                const countdown = setInterval(() => {
                    setTimeLeft((prev) => (prev > 0 ? prev - 1 : 0));
                }, 1000);

                return () => {
                    clearTimeout(verifyTimer);
                    clearInterval(countdown);
                };
            }, []);

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `0${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            return (
                <div className="h-screen w-full flex flex-col bg-[#0b1120]">
                    {/* Header Progress Bar  */}
                    <header className="p-4 border-b border-white/5 bg-black/20 backdrop-blur-md">
                        <div className="max-w-md mx-auto">
                            <div className="flex justify-between text-[10px] font-black tracking-widest mb-2 opacity-50 uppercase">
                                <span>STEP 2 OF 3</span>
                                <span className="text-green-400">90% COMPLETE</span>
                            </div>
                            <div className="w-full bg-gray-800 h-1 rounded-full overflow-hidden">
                                <div className="bg-green-500 h-full transition-all duration-1000" style={{width: '90%'}}></div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 flex flex-col items-center justify-start pt-10 px-6 text-center">
                        {/* Status Badge [cite: 1] */}
                        <div className="border border-green-500/30 bg-green-500/10 px-4 py-1.5 rounded-full mb-6 inline-flex items-center gap-2">
                            <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                            <span className="text-green-400 font-bold text-[11px] tracking-widest uppercase">STATUS: ELIGIBLE</span>
                        </div>

                        {/* Title: Optimized size for mobile  */}
                        <h1 className="text-2xl font-black mb-1 uppercase tracking-widest leading-none">Congratulations!</h1>
                        <p className="text-gray-500 text-xs font-bold uppercase tracking-wider mb-8">Verification Successful</p>

                        {/* Image: Absolute center anchor  */}
                        <div className="relative mb-10 w-full max-w-[220px]">
                            <div className="absolute inset-0 bg-green-500/10 blur-3xl rounded-full"></div>
                            <img 
                                src="assets/cash-balance-750-Bs3MQuLl.png" 
                                alt="Reward" 
                                className="relative w-full rounded-2xl shadow-2xl border border-white/5"
                            />
                        </div>

                        {/* Button Zone: No layout shifting  */}
                        <div className="w-full max-w-[300px] h-32 flex flex-col items-center">
                            {verifying ? (
                                <div className="flex flex-col items-center">
                                    <div className="w-6 h-6 border-2 border-green-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                                    <p className="text-[10px] font-black text-gray-500 uppercase tracking-[0.2em]">Verifying Identity...</p>
                                </div>
                            ) : (
                                <div className="btn-slide-in flex flex-col items-center w-full">
                                    <button 
                                        onClick={() => window.location.href = 'YOUR_AFFILIATE_LINK_HERE'}
                                        className="w-full bg-[#00d632] text-black font-black text-lg py-5 rounded-xl shadow-[0_10px_25px_-5px_rgba(0,214,50,0.4)] pulse-glow active:scale-95 transition-all"
                                    >
                                        CLAIM $750 NOW →
                                    </button>
                                    <p className="mt-4 text-[10px] text-gray-400 font-black uppercase tracking-[0.2em]">
                                        🔥 OFFER EXPIRES IN: <span className="text-white">{formatTime(timeLeft)}</span>
                                    </p>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
