<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Status: Eligible ($750.00)</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b1120; color: white; overflow: hidden; }
        .btn-slide-in { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .shimmer-pulse { animation: shimmer 2.5s ease-in-out infinite; }
        @keyframes shimmer { 0%, 100% { filter: brightness(1); box-shadow: 0 0 15px rgba(0,214,50,0.3); } 50% { filter: brightness(1.25); box-shadow: 0 0 30px rgba(0,214,50,0.7); transform: scale(1.02); } }
    </style>
</head>
<body class="antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [verifying, setVerifying] = useState(true);
            const [timeLeft, setTimeLeft] = useState(300);

            useEffect(() => {
                const verifyTimer = setTimeout(() => setVerifying(false), 3000);
                const countdown = setInterval(() => setTimeLeft(p => p > 0 ? p - 1 : 0), 1000);
                return () => { clearTimeout(verifyTimer); clearInterval(countdown); };
            }, []);

            const formatTime = (s) => {
                const m = Math.floor(s / 60);
                const sc = s % 60;
                return `0${m}:${sc < 10 ? '0' : ''}${sc}`;
            };

            return (
                <div className="h-screen w-full flex flex-col bg-[#0b1120]">
                    <header className="p-4 border-b border-white/5 bg-black/20">
                        <div className="max-w-md mx-auto">
                            <div className="flex justify-between text-[10px] font-black tracking-widest mb-2 opacity-50 uppercase">
                                <span>STEP 2 OF 3</span>
                                <span className="text-green-400">90% COMPLETE</span>
                            </div>
                            <div className="w-full bg-gray-800 h-1 rounded-full overflow-hidden">
                                <div className="bg-green-500 h-full transition-all duration-1000" style={{width: '90%'}}></div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 flex flex-col items-center justify-start pt-6 px-6 text-center">
                        <div className="border border-green-500/30 bg-green-500/10 px-4 py-1.5 rounded-full mb-4 inline-flex items-center gap-2">
                            <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                            <span className="text-green-400 font-bold text-[10px] tracking-widest uppercase">STATUS: ELIGIBLE</span>
                        </div>

                        <h1 className="text-xl font-black mb-1 uppercase tracking-widest">Congratulations!</h1>
                        <p className="text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-6">Identity Verification</p>

                        <div className="relative mb-6 w-full max-w-[310px]">
                            <div className="absolute inset-0 bg-green-500/15 blur-[60px] rounded-full"></div>
                            <img 
                                src="assets/cash-balance-750-Bs3MQuLl.png" 
                                alt="Reward" 
                                className="relative w-full rounded-2xl shadow-2xl border border-white/10"
                            />
                        </div>

                        <div className="w-full max-w-[300px] h-32 flex flex-col items-center justify-center">
                            {verifying ? (
                                <div className="flex flex-col items-center">
                                    <div className="w-6 h-6 border-2 border-green-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                                    <p className="text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] animate-pulse">Verifying Identity...</p>
                                </div>
                            ) : (
                                <div className="btn-slide-in flex flex-col items-center w-full">
                                    <button 
                                        onClick={() => window.location.href = 'YOUR_AFFILIATE_LINK_HERE'}
                                        className="w-full bg-[#00d632] text-black font-black text-lg py-5 rounded-xl shadow-[0_0_20px_rgba(0,214,50,0.4)] shimmer-pulse active:scale-95 transition-all"
                                    >
                                        CLAIM $750.00 NOW →
                                    </button>
                                    <p className="mt-4 text-[10px] text-gray-400 font-black uppercase tracking-[0.2em]">
                                        🔥 EXPIRES IN: <span className="text-white tabular-nums">{formatTime(timeLeft)}</span>
                                    </p>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
