<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status: Eligible ($750.00)</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes pulse-slow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.05); } }
        .animate-pulse-slow { animation: pulse-slow 2s ease-in-out infinite; }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [verifying, setVerifying] = useState(true);
            const [showButton, setShowButton] = useState(false);

            useEffect(() => {
                // Simulate the "Expert" verification flow
                const timer = setTimeout(() => {
                    setVerifying(false);
                    setShowButton(true);
                }, 3000);
                return () => clearTimeout(timer);
            }, []);

            return (
                <div class="min-h-screen flex flex-col">
                    {/* Header with Progress Bar [cite: 2] */}
                    <header class="bg-black/50 p-4 border-b border-gray-700">
                        <div class="max-w-md mx-auto">
                            <div class="flex justify-between text-xs mb-2">
                                <span class="text-gray-400 font-bold">STEP 2 OF 3</span>
                                <span class="text-green-400 font-bold">90% COMPLETE</span>
                            </div>
                            <div class="w-full bg-gray-700 h-2 rounded-full overflow-hidden">
                                <div class="bg-green-500 h-full transition-all duration-1000" style={{width: '90%'}}></div>
                            </div>
                        </div>
                    </header>

                    <main class="flex-1 flex flex-col items-center justify-center p-6 text-center">
                        {/* Status Badge [cite: 2] */}
                        <div class="border-2 border-green-500 bg-green-500/10 px-6 py-2 rounded-full mb-8">
                            <span class="text-green-400 font-black text-xl">STATUS: ELIGIBLE ($750.00)</span>
                        </div>

                        {verifying ? (
                            <div class="flex flex-col items-center">
                                <div class="w-12 h-12 border-4 border-green-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                                <p class="text-xl font-bold animate-pulse">Verifying Identity...</p>
                            </div>
                        ) : (
                            <div class="animate-in fade-in duration-700">
                                <h1 class="text-4xl font-black mb-4 uppercase tracking-tighter">Congratulations!</h1>
                                <p class="text-gray-400 mb-8">Your account is ready. Claim your reward below.</p>
                                
                                {/* Pulsing CTA Button [cite: 2] */}
                                <button 
                                    onClick={() => window.location.href = 'YOUR_AFFILIATE_LINK_HERE'}
                                    class="bg-green-500 hover:bg-green-400 text-black font-black text-2xl py-6 px-12 rounded-2xl shadow-[0_0_30px_rgba(34,197,94,0.4)] animate-pulse-slow transition-transform"
                                >
                                    CLAIM $750 NOW →
                                </button>
                                
                                <p class="mt-8 text-xs text-gray-500 uppercase tracking-widest">⚡ Limited Spots Available Today</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
