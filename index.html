<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Status: Eligible ($750.00)</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        @keyframes pulse-slow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        .animate-pulse-slow { animation: pulse-slow 2s ease-in-out infinite; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#0f172a] text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [verifying, setVerifying] = useState(true);
            const [showButton, setShowButton] = useState(false);

            useEffect(() => {
                const timer = setTimeout(() => {
                    setVerifying(false);
                    setShowButton(true);
                }, 3000); // 3-second verification
                return () => clearTimeout(timer);
            }, []);

            return (
                <div className="min-h-screen flex flex-col w-full">
                    {/* Header with Progress Bar */}
                    <header className="bg-black/40 backdrop-blur-md p-4 border-b border-white/10 sticky top-0 z-50">
                        <div className="max-w-md mx-auto w-full">
                            <div className="flex justify-between text-[10px] font-black tracking-widest mb-2">
                                <span className="text-gray-400">STEP 2 OF 3</span>
                                <span className="text-green-400">90% COMPLETE</span>
                            </div>
                            <div className="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden">
                                <div className="bg-green-500 h-full transition-all duration-1000" style={{width: '90%'}}></div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 flex flex-col items-center justify-start pt-12 px-6 text-center w-full">
                        {/* Status Badge */}
                        <div className="border border-green-500/50 bg-green-500/10 px-4 py-1.5 rounded-full mb-6 inline-flex items-center gap-2">
                            <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                            <span className="text-green-400 font-bold text-sm tracking-tight">STATUS: ELIGIBLE ($750.00)</span>
                        </div>

                        {verifying ? (
                            <div className="flex flex-col items-center mt-10">
                                <div className="w-10 h-10 border-3 border-green-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                                <p className="text-lg font-medium text-gray-300">Verifying Identity...</p>
                            </div>
                        ) : (
                            <div className="fade-in w-full flex flex-col items-center">
                                <h1 className="text-3xl sm:text-4xl font-black mb-3 leading-tight tracking-tight uppercase">
                                    Congratulations!
                                </h1>
                                <p className="text-gray-400 text-base mb-8 max-w-[280px]">
                                    Your verification is complete. Claim your <span className="text-white font-bold">$750.00</span> reward below.
                                </p>
                                
                                {/* Optimized Image Container */}
                                <div className="relative mb-10 w-full max-w-[260px]">
                                    <div className="absolute inset-0 bg-green-500/20 blur-2xl rounded-full"></div>
                                    <img 
                                        src="assets/cash-balance-750-Bs3MQuLl.png" 
                                        alt="Reward" 
                                        className="relative w-full rounded-xl shadow-2xl border border-white/10"
                                    />
                                </div>

                                {/* Responsive Pulsing CTA Button */}
                                <button 
                                    onClick={() => window.location.href = 'YOUR_AFFILIATE_LINK_HERE'}
                                    className="w-full max-w-[300px] bg-green-500 hover:bg-green-400 text-black font-black text-xl py-5 rounded-2xl shadow-[0_10px_30px_-10px_rgba(34,197,94,0.6)] animate-pulse-slow transition-all active:scale-95"
                                >
                                    CLAIM $750 NOW →
                                </button>
                                
                                <p className="mt-8 text-[10px] text-gray-500 font-bold uppercase tracking-[0.2em]">
                                    ⚡ Limited Spots Available Today
                                </p>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
