<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Status: Eligible ($750.00)</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; overflow: hidden; }
        .btn-slide-in { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .pulse-soft { animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
    </style>
</head>
<body class="antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [verifying, setVerifying] = useState(true);

            useEffect(() => {
                const timer = setTimeout(() => {
                    setVerifying(false);
                }, 3000); //
                return () => clearTimeout(timer);
            }, []);

            return (
                <div className="h-screen w-full flex flex-col bg-[#0f172a]">
                    {/* Locked Header */}
                    <header className="p-4 border-b border-white/5 bg-black/20 backdrop-blur-md">
                        <div className="max-w-md mx-auto">
                            <div className="flex justify-between text-[10px] font-black tracking-widest mb-2 opacity-60">
                                <span>STEP 2 OF 3</span>
                                <span className="text-green-400">90% COMPLETE</span>
                            </div>
                            <div className="w-full bg-gray-800 h-1 rounded-full overflow-hidden">
                                <div className="bg-green-500 h-full transition-all duration-1000" style={{width: '90%'}}></div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 flex flex-col items-center justify-start pt-8 px-6 text-center overflow-hidden">
                        {/* Status Badge */}
                        <div className="border border-green-500/30 bg-green-500/5 px-4 py-1 rounded-full mb-6 inline-flex items-center gap-2">
                            <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                            <span className="text-green-400 font-bold text-[12px] tracking-tight uppercase">STATUS: ELIGIBLE ($750.00)</span>
                        </div>

                        {/* Title Section: Lowered font size to prevent "trash" look on mobile */}
                        <h1 className="text-3xl font-black mb-1 uppercase tracking-tighter">Congratulations!</h1>
                        <p className="text-gray-400 text-sm mb-8">Verification Successful</p>

                        {/* Centered Image Anchor: This stays perfectly still */}
                        <div className="relative mb-8 w-full max-w-[240px] transition-all duration-500">
                            <div className="absolute inset-0 bg-green-500/10 blur-3xl rounded-full"></div>
                            <img 
                                src="assets/cash-balance-750-Bs3MQuLl.png" 
                                alt="Reward" 
                                className="relative w-full rounded-2xl shadow-2xl border border-white/10"
                            />
                        </div>

                        {/* Dynamic Interaction Zone */}
                        <div className="w-full max-w-[300px] h-32 flex flex-col items-center justify-start">
                            {verifying ? (
                                <div className="flex flex-col items-center animate-pulse">
                                    <div className="w-8 h-8 border-2 border-green-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                                    <p className="text-xs font-bold text-gray-500 uppercase tracking-widest">Verifying Account...</p>
                                </div>
                            ) : (
                                <div className="btn-slide-in flex flex-col items-center w-full">
                                    <button 
                                        onClick={() => window.location.href = 'YOUR_AFFILIATE_LINK_HERE'}
                                        className="w-full bg-green-500 text-black font-black text-xl py-5 rounded-2xl shadow-[0_15px_35px_-10px_rgba(34,197,94,0.5)] pulse-soft active:scale-95 transition-transform"
                                    >
                                        CLAIM $750 NOW →
                                    </button>
                                    <p className="mt-4 text-[9px] text-gray-500 font-black uppercase tracking-[0.2em]">
                                        ⚡ Offer Expires In 04:59
                                    </p>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
